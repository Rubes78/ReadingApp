<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading List</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#e3e1d9;--hover:#f0eee7;--acc:#8a4b2a;--acc-ink:#fff;--ok:#2f7d4f;--bad:#a63d2f}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--card:#211f1c;--ink:#ecebe6;--mute:#9a988f;--line:#34322d;--hover:#2a2825;--acc:#d08a5c;--acc-ink:#1a1206;--ok:#6cc58f;--bad:#e08375}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;max-width:1200px;margin:auto}
h1{font:600 19px/1 Georgia,serif;margin:0}
main{max-width:1200px;margin:auto;padding:0 16px 48px}
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
nav button{background:none;border:0;color:var(--mute);padding:8px 14px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
nav button.on{color:var(--ink);border-color:var(--acc)}
button.b,label.b{background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
button.g{background:none;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:2px 8px;cursor:pointer;font:inherit;font-size:12px}
button.g:hover{background:var(--hover)}button:disabled{opacity:.5;cursor:wait}
input[type=text],select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:inherit;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.bar input[type=text]{flex:1;min-width:180px}
.note{color:var(--mute);font-size:13px;margin:0 0 10px}.warn{color:var(--bad)}.m{color:var(--mute);font-size:12px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--card);color:var(--mute);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;white-space:nowrap;user-select:none}
th.on::after{content:" ▲"}th.on.desc::after{content:" ▼"}
tbody tr:hover{background:var(--hover)}tr:last-child td{border-bottom:0}
td.n{color:var(--acc);font-weight:600;width:34px}td.t{font-weight:600;min-width:180px}
td.why{color:var(--mute);max-width:380px;cursor:pointer}td.why div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.open td.why div{white-space:normal}
td.act{white-space:nowrap;text-align:right}td.act .g{opacity:0;transition:opacity .1s}tr:hover td.act .g,tr:focus-within td.act .g{opacity:1}
@media (hover:none){td.act .g{opacity:1}}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.tag.own{color:var(--ok);border-color:var(--ok)}
select.st{padding:1px 4px;font-size:12px}
details.prefs{margin-bottom:10px}details.prefs summary{cursor:pointer;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
h3{margin:0 0 6px;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
ul.c{margin:0;padding-left:18px}.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin:0 4px 4px 0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Reading List</h1>
  <div><span id="meta" class="note" style="margin:0 8px 0 0"></span>
  <label class="b">Import Goodreads CSV<input id="file" type="file" accept=".csv" hidden></label></div>
</header>
<main>
  <nav id="tabs"></nav>
  <div id="view"></div>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cfg={}, tab='list', lib=[], list=[], prefs={more:'',less:'',notes:''}, sort={list:null,discover:null,library:null};
const TABS={list:'My list',discover:'Discover',library:'Library',taste:'Taste'};
const api=async(u,o={})=>{const r=await fetch(u,o.body&&!(o.body instanceof FormData)?{...o,headers:{'content-type':'application/json'},body:JSON.stringify(o.body)}:o);
  if(r.status===204)return null;const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2800)};
const busy=async(btn,fn)=>{btn.disabled=true;const o=btn.textContent;btn.textContent='Working…';try{await fn()}catch(e){toast(e.message)}finally{btn.disabled=false;btn.textContent=o}};
const onList=(t,a)=>list.some(i=>i.title.toLowerCase()===t.toLowerCase()&&i.author.toLowerCase()===a.toLowerCase());
const J=o=>esc(JSON.stringify(o));
const own=b=>b.owned?'<span class="tag own">In Calibre</span>':'';
function shelfmark(t,a){navigator.clipboard?.writeText(`${t} ${a}`);window.open(cfg.shelfmark_url,'_blank');toast('Copied "'+t+' '+a+'" — paste it into ShelfMark search')}
const btn=(label,attr,v)=>`<button class="g" data-${attr}='${v}'>${label}</button>`;
const smBtn=b=>b.owned?'':btn('Get',"sm",J([b.title,b.author]));
const addBtn=(t,a,x={})=>onList(t,a)?'<span class="m">on list</span>':btn('+ List','add',J({title:t,author:a,...x}));
const prefsBox=()=>`<details class="prefs"><summary>Your preferences (applied to every recommendation and ranking)</summary>
  <div class="bar" style="margin-top:8px"><input id="pm" type="text" placeholder="More of… e.g. historical fiction, ancient empires" value="${esc(prefs.more)}">
  <input id="pl" type="text" placeholder="Less of… e.g. science fiction" value="${esc(prefs.less)}"><button class="g" id="ps">Save</button></div></details>`;
const savePrefs=async()=>{prefs={...prefs,more:$('#pm').value,less:$('#pl').value};await api('/api/prefs',{method:'PUT',body:prefs})};
const wirePrefs=()=>{$('#ps').onclick=e=>busy(e.target,async()=>{await savePrefs();toast('Preferences saved')})};
const noKey=()=>cfg.backend?'':`<p class="note warn">No AI backend — set <code>ANTHROPIC_API_KEY</code> in <code>.env</code>, or make Claude Code available to the container.</p>`;

/* generic sheet: cols=[{k,label,get(row)->sortable value,html(row)}]; sorting is per-tab and only client-side */
function sheet(name,cols,rows,rowAttr=''){
  const s=sort[name];
  if(s){const c=cols.find(c=>c.k===s.k);rows=rows.slice().sort((a,b)=>{const x=c.get(a),y=c.get(b);
    return (x>y?1:x<y?-1:0)*(s.desc?-1:1)})}
  return `<div class="sheet"><table><thead><tr>${cols.map(c=>`<th data-sort="${name}:${c.k}" class="${s&&s.k===c.k?'on'+(s.desc?' desc':''):''}">${c.label}</th>`).join('')}</tr></thead>
   <tbody>${rows.map((r,n)=>`<tr ${rowAttr}>${cols.map(c=>c.html(r,n)).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="m">Nothing here yet.</td></tr>`}</tbody></table></div>`}
const titleCell=r=>`<td class="t">${esc(r.title)}${r.series?` <span class="m">(${esc(r.series)}${r.series_num?' #'+esc(r.series_num):''})</span>`:''}</td>`;
const whyCell=t=>`<td class="why" data-open="1"><div>${esc(t)}</div></td>`;

async function init(){
  cfg=await api('/api/config');
  $('#meta').textContent=cfg.book_count?`${cfg.book_count} Goodreads · ${cfg.calibre_count} in Calibre`:'No library yet';
  $('#tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-tab="${k}">${v}</button>`).join('');
  [lib,list,prefs]=await Promise.all([api('/api/library'),api('/api/list'),api('/api/prefs')]);
  render();
}
async function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  await VIEWS[tab]($('#view'));
}

const VIEWS={
async list(el){
  const q=($('#lq')?.value||'').toLowerCase(),st=$('#lst')?.value||'';
  const shown=list.filter(i=>(!st||i.status===st)&&(i.title+' '+i.author).toLowerCase().includes(q));
  const manual=!sort.list&&!q&&!st;  // reordering only makes sense on the untouched, full order
  const cols=[
    {k:'n',label:'#',get:i=>list.indexOf(i),html:(i)=>`<td class="n">${list.indexOf(i)+1}</td>`},
    {k:'title',label:'Title',get:i=>i.title.toLowerCase(),html:titleCell},
    {k:'author',label:'Author',get:i=>i.author.toLowerCase(),html:i=>`<td>${esc(i.author)}</td>`},
    {k:'why',label:'Why',get:i=>i.reason||'',html:i=>whyCell(i.reason)},
    {k:'status',label:'Status',get:i=>i.status,html:i=>`<td><select class="st" data-st="${i.id}">${['queued','reading','done'].map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}</select> ${own(i)}</td>`},
    {k:'act',label:'',get:()=>0,html:i=>`<td class="act">${manual?btn('↑','mv',J({id:i.id,to:'up'}))+btn('↓','mv',J({id:i.id,to:'down'}))+btn('Top','mv',J({id:i.id,to:'top'})):''}${smBtn(i)}${btn('✕','rm',i.id)}</td>`}];
  el.innerHTML=`<div class="bar"><input id="lq" type="text" placeholder="Filter title or author" value="${esc(q)}"><select id="lst"><option value="">All statuses</option>${['queued','reading','done'].map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}</select>
    <a class="g" style="text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:12px" href="/api/list.csv">Export CSV</a></div>`+
    (list.length?sheet('list',cols,shown):'<p class="note">Your list is empty. Add books from Discover or the Library.</p>');
  $('#lq').oninput=()=>{const p=$('#lq').selectionStart;render().then(()=>{$('#lq').focus();$('#lq').setSelectionRange(p,p)})};$('#lst').onchange=render;
},
async discover(el){
  const [recs,p]=await Promise.all([api('/api/recs'),api('/api/prioritized')]);
  const rows=[...p.items.filter(i=>i.rank!=null).map(i=>({...i,src:'To-read #'+i.rank,ord:i.rank,reason:i.reason,gr:i.id})),
              ...recs.slice().reverse().map((r,n)=>({...r,src:'AI rec',ord:1000+n,reason:r.why}))];
  const cols=[
    {k:'src',label:'Source',get:r=>r.ord,html:r=>`<td class="m" style="white-space:nowrap">${esc(r.src)}</td>`},
    {k:'title',label:'Title',get:r=>r.title.toLowerCase(),html:r=>titleCell(r)},
    {k:'author',label:'Author',get:r=>r.author.toLowerCase(),html:r=>`<td>${esc(r.author)}${r.year?` <span class="m">${r.year}</span>`:''}</td>`},
    {k:'why',label:'Why',get:r=>r.reason||'',html:r=>whyCell(r.reason)},
    {k:'own',label:'',get:r=>!!r.owned,html:r=>`<td>${own(r)}${r.verified===null?' <span class="tag warn">unverified</span>':''}</td>`},
    {k:'act',label:'',get:()=>0,html:r=>`<td class="act">${addBtn(r.title,r.author,{cover:r.cover,reason:r.reason,ol_key:r.ol_key,gr_id:r.gr})}${smBtn(r)}${btn('👍','fb',J({title:r.title,author:r.author,verdict:'like'}))}${r.id&&r.src==='AI rec'?btn('Not for me','dis',r.id):btn('Not for me','fb',J({title:r.title,author:r.author,verdict:'dislike'}))}</td>`}];
  el.innerHTML=`${noKey()}${prefsBox()}<div class="bar"><input id="focus" type="text" placeholder="Optional focus, e.g. ancient Persia, or lighter sci-fi">
    <button class="b" id="go">Get recommendations</button><button class="b" id="rank">${p.created?'Re-rank':'Rank'} my to-read queue</button></div>
    <p class="note">Recommendations skip anything already in your Goodreads library or Calibre. ${p.created?'Queue ranked '+new Date(p.created).toLocaleString()+'.':''}</p>`+sheet('discover',cols,rows);
  wirePrefs();
  $('#go').onclick=e=>busy(e.target,async()=>{await savePrefs();const r=await api('/api/recommend',{method:'POST',body:{focus:$('#focus').value}});
    toast(`${r.added} new (${r.already_owned} already owned, ${r.unverified} unverifiable)`);render()});
  $('#rank').onclick=e=>busy(e.target,async()=>{await savePrefs();await api('/api/prioritize',{method:'POST'});render()});
},
async library(el){
  const q=($('#q')?.value||'').toLowerCase(),st=$('#st')?.value||'';
  const shown=lib.filter(b=>(!st||b.status===st)&&(b.title+' '+b.author).toLowerCase().includes(q)).slice(0,500);
  const cols=[
    {k:'title',label:'Title',get:b=>b.title.toLowerCase(),html:titleCell},
    {k:'author',label:'Author',get:b=>b.author.toLowerCase(),html:b=>`<td>${esc(b.author)}</td>`},
    {k:'status',label:'Status',get:b=>b.status,html:b=>`<td>${b.status}</td>`},
    {k:'rating',label:'★',get:b=>b.rating||0,html:b=>`<td>${b.rating||''}</td>`},
    {k:'own',label:'Calibre',get:b=>!!b.owned,html:b=>`<td>${b.owned?'<span class="tag own">✓</span>':''}</td>`},
    {k:'act',label:'',get:()=>0,html:b=>`<td class="act">${b.status==='to-read'?addBtn(b.title,b.author):''}</td>`}];
  el.innerHTML=`<div class="bar"><input id="q" type="text" placeholder="Search title or author" value="${esc(q)}"><select id="st"><option value="">All</option>${['to-read','read','dnf','reading'].map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}</select></div>`+sheet('library',cols,shown);
  $('#q').oninput=()=>{const p=$('#q').selectionStart;render().then(()=>{$('#q').focus();$('#q').setSelectionRange(p,p)})};$('#st').onchange=render;
},
async taste(el){
  const p=await api('/api/profile'),c=p.counts||{};
  el.innerHTML=`<div class="grid">
   <div class="box"><h3>Library</h3>${Object.entries(c).map(([k,v])=>`${k}: <b>${v}</b>`).join(' · ')}<br><span class="m">Median finished length ${p.median_pages_finished} pages</span></div>
   <div class="box"><h3>Most-read authors</h3><ul class="c">${p.top_authors.slice(0,12).map(a=>`<li>${esc(a.author)} — ${a.read}${a.avg?` (avg ${a.avg})`:''}</li>`).join('')}</ul></div>
   <div class="box"><h3>Abandoned</h3><ul class="c">${p.dnf.slice(0,12).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div class="box"><h3>Series in progress</h3><ul class="c">${p.series_in_progress.slice(0,12).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div class="box"><h3>Shelves</h3>${Object.entries(p.shelves).map(([k,v])=>`<span class="pill">${esc(k)} ${v}</span>`).join('')}</div></div>`;
}};

document.addEventListener('click',async e=>{
  const th=e.target.closest('th[data-sort]');
  if(th){const [n,k]=th.dataset.sort.split(':'),s=sort[n];sort[n]=!s||s.k!==k?{k,desc:false}:s.desc?null:{k,desc:true};return render()}
  const w=e.target.closest('td.why');if(w){w.parentElement.classList.toggle('open');return}
  const t=e.target,d=t.dataset;
  if(d.tab){tab=d.tab;render()}
  else if(d.add){const b=JSON.parse(d.add);await busy(t,async()=>{await api('/api/list',{method:'POST',body:b});list=await api('/api/list');render()})}
  else if(d.sm){shelfmark(...JSON.parse(d.sm))}
  else if(d.mv){const m=JSON.parse(d.mv);await api(`/api/list/${m.id}/move`,{method:'POST',body:{to:m.to}});list=await api('/api/list');render()}
  else if(d.rm){await api(`/api/list/${d.rm}`,{method:'DELETE'});list=await api('/api/list');render()}
  else if(d.fb){const f=JSON.parse(d.fb);await api('/api/feedback',{method:'POST',body:f});toast(f.verdict==='like'?'Noted — will find more like this':'Hidden, and won\'t be suggested again');render()}
  else if(d.dis){await api(`/api/recs/${d.dis}`,{method:'DELETE'});render()}
});
document.addEventListener('change',async e=>{
  if(e.target.dataset.st){await api(`/api/list/${e.target.dataset.st}`,{method:'PATCH',body:{status:e.target.value}});list=await api('/api/list');render()}
});
$('#file').onchange=async e=>{const fd=new FormData();fd.append('file',e.target.files[0]);
  try{const r=await api('/api/import',{method:'POST',body:fd});toast(`Imported ${r.imported} books`);await init()}catch(x){toast(x.message)}};
init();
</script>
</body>
</html>

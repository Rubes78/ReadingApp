services:
  reading-list:
    build: .
    image: reading-list:latest
    container_name: reading-list
    env_file: .env
    environment:
      - TZ=America/Chicago
      - PORT=5000
      - SHELFMARK_URL=http://holobooks.local:8085
      - CLAUDE_BIN=/root/.local/bin/claude
      - HOME=/root
      - CLAUDE_CONFIG_DIR=/root/.claude
    volumes:
      - /Quarks/Data/Dockers/reading-list:/data
      # Claude Code CLI + its login, so AI features work without an API key. The host binary is glibc-compatible
      # with the image. ~/.claude is mounted read-write so token refreshes land in the one shared credentials file.
      - /root/.local/share/claude:/root/.local/share/claude:ro
      - /root/.local/bin:/root/.local/bin:ro
      - /root/.claude:/root/.claude
    ports:
      - "5602:5000"
    restart: unless-stopped
